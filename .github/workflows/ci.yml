name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python suites (bridge, calendar, config helper, plugin structure)
        run: python3 -m unittest discover -s tests -v
      - name: Label state machine
        run: node --test tests/model.test.js
  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: qmllint (syntax only; Quickshell modules are not available here, so warnings are expected)
        run: |
          status=0
          for f in *.qml; do
            out=$(/usr/lib/qt6/bin/qmllint --import disable --unqualified disable "$f" 2>&1) || true
            printf '%s\n' "$out" | grep -v '^$' | head -20
            if printf '%s\n' "$out" | grep -qE '(^|: )[Ee]rror'; then echo "::error file=$f::qmllint reported an error"; status=1; fi
          done
          exit $status
